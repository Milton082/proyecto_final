spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/academic_events_db}
    username: ${DB_USERNAME:ups}
    password: ${DB_PASSWORD:ups123}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

jwt:
  secret: ${JWT_SECRET:academic-events-local-prod-secret-key-2026-minimum-32-characters}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

security:
  login:
    rate-limit-max-requests: ${LOGIN_RATE_LIMIT_MAX:10}
    rate-limit-window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:60}
    rate-limit:
    public:
      max-requests: ${PUBLIC_RATE_LIMIT_MAX:60}
      window-seconds: ${PUBLIC_RATE_LIMIT_WINDOW:60}

    authenticated:
      max-requests: ${AUTH_RATE_LIMIT_MAX:120}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW:60}

    reports:
      max-requests: ${REPORT_RATE_LIMIT_MAX:5}
      window-seconds: ${REPORT_RATE_LIMIT_WINDOW:60}
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    failed-attempt-window-seconds: ${LOGIN_FAILED_WINDOW:900}
    block-duration-seconds: ${LOGIN_BLOCK_DURATION:900}

  cors:
    allowed-origins:
      - ${FRONTEND_URL}

    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - X-Correlation-ID

    exposed-headers:
      - X-Correlation-ID

    allow-credentials: true
    max-age: 3600

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: INFO
    ec.edu.ups.academic_events_api: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
