server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: academic-events-api

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

security:
  login:
    rate-limit:
      max-requests: ${LOGIN_RATE_LIMIT_MAX:10}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:60}

    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    failed-attempt-window-seconds: ${LOGIN_FAILED_WINDOW:900}
    block-duration-seconds: ${LOGIN_BLOCK_DURATION:900}

  rate-limit:
    public:
      max-requests: ${PUBLIC_RATE_LIMIT_MAX:60}
      window-seconds: ${PUBLIC_RATE_LIMIT_WINDOW:60}

    authenticated:
      max-requests: ${AUTH_RATE_LIMIT_MAX:120}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW:60}

    reports:
      max-requests: ${REPORT_RATE_LIMIT_MAX:5}
      window-seconds: ${REPORT_RATE_LIMIT_WINDOW:60}

  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}

    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - X-Correlation-ID

    exposed-headers:
      - X-Correlation-ID

    allow-credentials: true
    max-age: 3600

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health

  endpoint:
    health:
      show-details: never
      show-components: never

  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    ec.edu.ups.academic_events_api: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
