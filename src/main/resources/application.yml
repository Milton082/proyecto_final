server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: academic-events-api
  datasource:
    url: jdbc:postgresql://localhost:5433/academic_events_db
    username: ups
    password: ups123
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWT_SECRET:development-secret-key-for-academic-events-api-2026}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health
