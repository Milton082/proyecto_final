services:
  postgres:
    image: postgres:17-alpine
    container_name: academic-events-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ups
      POSTGRES_PASSWORD: ups123
      POSTGRES_DB: postgres
      TZ: America/Guayaquil

    ports:
      - "5433:5432"

    volumes:
      - academic_events_postgres_data:/var/lib/postgresql/data
      - ./src/main/sql:/sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: academic-events-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - academic_events_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  academic_events_postgres_data:
  academic_events_redis_data:
